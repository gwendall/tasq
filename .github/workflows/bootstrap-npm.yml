name: Bootstrap npm package identities

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact main commit to build and publish
        required: true
        type: string
      confirmation:
        description: Type bootstrap-seven-packages
        required: true
        type: string

permissions: {}

concurrency:
  group: tasq-npm-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify one-shot identity
        shell: bash
        env:
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          INPUT_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "gwendall/tasq"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$INPUT_CONFIRMATION" = "bootstrap-seven-packages"
          [[ "$INPUT_SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$INPUT_SOURCE_COMMIT"
          test "$(git rev-parse origin/main)" = "$INPUT_SOURCE_COMMIT"
          test -z "$(git tag --points-at HEAD)"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Pin the npm bootstrap client
        run: |
          npm install --global npm@11.18.0
          test "$(npm --version)" = "11.18.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - run: pnpm install --frozen-lockfile
      - name: Verify the complete source candidate
        run: pnpm verify:handoff
      - name: Build deterministic prerelease candidates
        env:
          INPUT_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: >-
          bun scripts/release/build-public-packages.ts
          --version 0.1.0-alpha.0
          --source-commit "$INPUT_SOURCE_COMMIT"
          --outdir dist/packages
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: "dist/packages/*"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tasq-npm-bootstrap-candidates
          path: "dist/packages/*"
          if-no-files-found: error
      - name: Publish only missing byte-identical bootstrap versions
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
          INPUT_SOURCE_COMMIT: ${{ inputs.source_commit }}
          TASQ_BOOTSTRAP_PACKAGES: >-
            ["@tasq-run/schema","@tasq-run/core","@tasq-run/cli","@tasq-run/mcp",
            "@tasq-run/extension-sdk","@tasq-run/protocol-adapters","@tasq-run/console"]
        run: |
          set -euo pipefail
          : "${NODE_AUTH_TOKEN:?NPM_BOOTSTRAP_TOKEN is required}"
          release="dist/packages/tasq-packages-v0.1.0-alpha.0.release.json"
          handled=0
          while IFS=$'\t' read -r package filename; do
            jq --exit-status --arg package "$package" \
              'index($package) != null' <<< "$TASQ_BOOTSTRAP_PACKAGES" >/dev/null ||
              continue
            candidate="dist/packages/$filename"
            verification="$(
              bun scripts/release/verify-npm-publication.ts \
                --package "$package" \
                --version 0.1.0-alpha.0 \
                --source-commit "$INPUT_SOURCE_COMMIT" \
                --tarball "$candidate" \
                --allow-missing
            )"
            if test "$(jq -r '.status' <<< "$verification")" = "missing"; then
              npm publish "$candidate" \
                --access public \
                --tag alpha-bootstrap \
                --provenance
            fi
            bun scripts/release/verify-npm-publication.ts \
              --package "$package" \
              --version 0.1.0-alpha.0 \
              --source-commit "$INPUT_SOURCE_COMMIT" \
              --tarball "$candidate"
            handled=$((handled + 1))
          done < <(jq -r '.packages[] | [.name, .filename] | @tsv' "$release")
          test "$handled" = "7"
