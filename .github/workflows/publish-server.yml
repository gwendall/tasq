name: Publish protected Tasq Server image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact stable SemVer authorized in release policy
        required: true
        type: string
      source_commit:
        description: Exact lowercase 40-character tagged source commit
        required: true
        type: string
      confirmation:
        description: Type publish-tasq-server
        required: true
        type: string

permissions: {}

concurrency:
  group: tasq-server-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.authorization.outputs.version }}
      commit: ${{ steps.authorization.outputs.commit }}
      image: ${{ steps.authorization.outputs.image }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - id: authorization
        name: Verify exact protected publication authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          INPUT_SOURCE_COMMIT: ${{ inputs.source_commit }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "gwendall/tasq"
          test "$INPUT_CONFIRMATION" = "publish-tasq-server"
          [[ "$INPUT_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$INPUT_SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$INPUT_SOURCE_COMMIT"
          release_tag="v${INPUT_VERSION}"
          test "$GITHUB_REF" = "refs/heads/main" || test "$GITHUB_REF" = "refs/tags/${release_tag}"
          test "$(git rev-parse "refs/tags/${release_tag}^{commit}")" = "$INPUT_SOURCE_COMMIT"
          test "$(
            gh release view "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --json tagName \
              --jq .tagName
          )" = "$release_tag"
          bun scripts/release/verify-candidate-publication-authorization.ts \
            --surface serverImage \
            --version "$INPUT_VERSION" \
            --source-commit "$INPUT_SOURCE_COMMIT" \
            --repository "$GITHUB_REPOSITORY"
          echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$INPUT_SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/gwendall/tasq-server" >> "$GITHUB_OUTPUT"

  publish-image:
    needs: authorize
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.selected-image.outputs.digest }}
    steps:
      - name: Check out the protected release automation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Snapshot release-only registry guards
        shell: bash
        run: |
          set -euo pipefail
          automation="$RUNNER_TEMP/tasq-release-automation"
          mkdir -p "$automation"
          install -m 0755 \
            scripts/release/resolve-oci-publication-resume.sh \
            "$automation/resolve-oci-publication-resume.sh"
          install -m 0755 \
            scripts/release/ensure-oci-tag.sh \
            "$automation/ensure-oci-tag.sh"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.authorize.outputs.commit }}
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - run: pnpm install --frozen-lockfile
      - name: Verify complete cross-surface source candidate
        run: pnpm verify:handoff
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - id: resume
        name: Resolve an absent or exactly reusable publication
        shell: bash
        run: |
          set -euo pipefail
          decision="$(
            "$RUNNER_TEMP/tasq-release-automation/resolve-oci-publication-resume.sh" \
              "${{ needs.authorize.outputs.image }}" \
              "${{ needs.authorize.outputs.version }}" \
              "${{ needs.authorize.outputs.commit }}"
          )"
          action="$(jq --raw-output .action <<< "$decision")"
          test "$action" = "build" || test "$action" = "reuse"
          digest="$(jq --raw-output '.digest // ""' <<< "$decision")"
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - id: build
        if: steps.resume.outputs.action == 'build'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: >-
            ${{ needs.authorize.outputs.image }}:build-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            TASQ_VERSION=${{ needs.authorize.outputs.version }}
            TASQ_SOURCE_COMMIT=${{ needs.authorize.outputs.commit }}
          provenance: mode=max
          sbom: true
      - id: selected-image
        name: Select one immutable image digest
        shell: bash
        run: |
          set -euo pipefail
          if test "${{ steps.resume.outputs.action }}" = "reuse"; then
            digest="${{ steps.resume.outputs.digest }}"
          else
            digest="${{ steps.build.outputs.digest }}"
          fi
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Validate immutable image identity and attached attestations
        shell: bash
        run: |
          set -euo pipefail
          digest="${{ steps.selected-image.outputs.digest }}"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          reference="${{ needs.authorize.outputs.image }}@$digest"
          raw="$(docker buildx imagetools inspect "$reference" --raw)"
          jq --exit-status '
            [.manifests[] | select(.platform.os == "linux")
              | .platform.architecture] | sort == ["amd64", "arm64"]
          ' <<< "$raw" >/dev/null
          jq --exit-status '
            [.manifests[] | select(
              .annotations["vnd.docker.reference.type"] == "attestation-manifest"
            )] | length >= 2
          ' <<< "$raw" >/dev/null
      - name: Verify protected source provenance before reusing a digest
        if: steps.resume.outputs.action == 'reuse'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh attestation verify
          "oci://${{ needs.authorize.outputs.image }}@${{ steps.selected-image.outputs.digest }}"
          --repo "$GITHUB_REPOSITORY"
          --signer-workflow "gwendall/tasq/.github/workflows/publish-server.yml"
          --source-digest "${{ needs.authorize.outputs.commit }}"
          --source-ref "$GITHUB_REF"
          --deny-self-hosted-runners
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        if: steps.resume.outputs.action == 'build'
        with:
          subject-name: ${{ needs.authorize.outputs.image }}
          subject-digest: ${{ steps.selected-image.outputs.digest }}
          push-to-registry: true
      - name: Replay both packaged Server platforms from the exact digest
        shell: bash
        run: |
          set -euo pipefail
          reference="${{ needs.authorize.outputs.image }}@${{ steps.selected-image.outputs.digest }}"
          docker pull --platform linux/amd64 "$reference"
          docker tag "$reference" tasq-server:protected-amd64
          amd64="$(bun scripts/server-container-smoke.ts tasq-server:protected-amd64)"
          jq --exit-status \
            --arg version "${{ needs.authorize.outputs.version }}" \
            --arg revision "${{ needs.authorize.outputs.commit }}" \
            '
              .platform == "linux/amd64"
              and .metadata.version == $version
              and .metadata.revision == $revision
            ' <<< "$amd64" >/dev/null
          docker pull --platform linux/arm64 "$reference"
          docker tag "$reference" tasq-server:protected-arm64
          arm64="$(bun scripts/server-container-smoke.ts tasq-server:protected-arm64)"
          jq --exit-status \
            --arg version "${{ needs.authorize.outputs.version }}" \
            --arg revision "${{ needs.authorize.outputs.commit }}" \
            '
              .platform == "linux/arm64"
              and .metadata.version == $version
              and .metadata.revision == $revision
            ' <<< "$arm64" >/dev/null
      - name: Promote the verified digest to immutable release tags
        shell: bash
        run: |
          set -euo pipefail
          reference="${{ needs.authorize.outputs.image }}@${{ steps.selected-image.outputs.digest }}"
          sha_tag="${{ needs.authorize.outputs.image }}:sha-${{ needs.authorize.outputs.commit }}"
          version_tag="${{ needs.authorize.outputs.image }}:${{ needs.authorize.outputs.version }}"

          # Verify an existing anchor byte-for-byte or create only the missing tag.
          # The human-facing version remains the final registry mutation.
          "$RUNNER_TEMP/tasq-release-automation/ensure-oci-tag.sh" \
            "$sha_tag" "$reference" "${{ steps.selected-image.outputs.digest }}"
          "$RUNNER_TEMP/tasq-release-automation/ensure-oci-tag.sh" \
            "$version_tag" "$reference" "${{ steps.selected-image.outputs.digest }}"
      - name: Build digest-bound publication metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/server
          prefix="tasq-server-v${{ needs.authorize.outputs.version }}"
          digest="${{ steps.selected-image.outputs.digest }}"
          jq --null-input \
            --arg version "${{ needs.authorize.outputs.version }}" \
            --arg commit "${{ needs.authorize.outputs.commit }}" \
            --arg image "${{ needs.authorize.outputs.image }}" \
            --arg digest "$digest" \
            '{
              contractVersion: "tasq.server-image-release.v1",
              version: $version,
              source: {
                repository: "https://github.com/gwendall/tasq",
                commit: $commit
              },
              image: {
                name: $image,
                digest: $digest,
                platforms: ["linux/amd64", "linux/arm64"],
                mutableTagIsAuthority: false
              },
              attestations: {
                sbom: "oci-attached",
                provenance: "oci-and-github-attestation",
                exactDigestRequired: true
              },
              effectsEnabled: false
            }' > "dist/server/${prefix}.release.json"
          (
            cd dist/server
            sha256sum "${prefix}.release.json" > "${prefix}.SHA256SUMS"
            sha256sum --check --status "${prefix}.SHA256SUMS"
          )
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tasq-server-publication-metadata
          path: dist/server/*
          if-no-files-found: error

  publish-release-metadata:
    needs: [authorize, publish-image]
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tasq-server-publication-metadata
          path: dist/server
      - name: Publish or verify immutable release metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p existing
          release_tag="v${{ needs.authorize.outputs.version }}"
          assets="$(
            gh release view "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets
          )"
          jq --exit-status '.assets | type == "array"' <<< "$assets" >/dev/null
          for asset in dist/server/*; do
            name="$(basename "$asset")"
            count="$(
              jq --arg name "$name" \
                '[.assets[] | select(.name == $name)] | length' \
                <<< "$assets"
            )"
            if test "$count" = 1; then
              gh release download "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --dir existing \
              --pattern "$name"
              cmp "$asset" "existing/$name"
            elif test "$count" = 0; then
              gh release upload "$release_tag" "$asset" \
                --repo "$GITHUB_REPOSITORY"
            else
              echo "Release contains duplicate asset name: $name" >&2
              exit 1
            fi
          done
