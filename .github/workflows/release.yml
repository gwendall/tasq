name: Protected release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

jobs:
  identity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
      packages: ${{ steps.identity.outputs.packages }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - id: identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "gwendall/tasq"
          test "$(git tag --points-at HEAD)" = "${GITHUB_REF_NAME}"
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          commit="$(git rev-parse HEAD)"
          authorization="$(
            bun scripts/release/verify-release-authorization.ts \
            --version "$version" \
            --source-commit "$commit" \
            --repository "$GITHUB_REPOSITORY"
          )"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "packages=$(jq -c .publicPackages <<< "$authorization")" >> "$GITHUB_OUTPUT"

  cli:
    needs: identity
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64-gnu
          - os: macos-14
            target: darwin-arm64
    runs-on: ${{ matrix.os }}
    environment: release
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - run: pnpm install --frozen-lockfile
      - name: Build deterministic CLI envelope
        run: >-
          bun scripts/release/build-public-release.ts
          --version "${{ needs.identity.outputs.version }}"
          --source-commit "${{ needs.identity.outputs.commit }}"
          --target "${{ matrix.target }}"
          --outdir "dist/${{ matrix.target }}"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: "dist/${{ matrix.target }}/*"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: "tasq-${{ matrix.target }}"
          path: "dist/${{ matrix.target }}/*"
          if-no-files-found: error

  npm:
    needs: [identity, cli]
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Pin the npm trusted-publishing client
        run: |
          npm install --global npm@11.18.0
          test "$(npm --version)" = "11.18.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - run: pnpm install --frozen-lockfile
      - name: Build package candidates
        run: >-
          bun scripts/release/build-public-packages.ts
          --version "${{ needs.identity.outputs.version }}"
          --source-commit "${{ needs.identity.outputs.commit }}"
          --outdir dist/packages
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: "dist/packages/*"
      - name: Publish through npm trusted publishing
        shell: bash
        env:
          TASQ_PUBLIC_PACKAGES: ${{ needs.identity.outputs.packages }}
        run: |
          set -euo pipefail
          release="dist/packages/tasq-packages-v${{ needs.identity.outputs.version }}.release.json"
          published=0
          while IFS=$'\t' read -r package_name filename; do
            jq --exit-status --arg package "$package_name" \
              'index($package) != null' <<< "$TASQ_PUBLIC_PACKAGES" >/dev/null ||
              continue
            tarball="dist/packages/$filename"
            decision="$(
              bun scripts/release/verify-npm-publication.ts \
                --package "$package_name" \
                --version "${{ needs.identity.outputs.version }}" \
                --source-commit "${{ needs.identity.outputs.commit }}" \
                --tarball "$tarball" \
                --allow-missing
            )"
            state="$(jq --raw-output .status <<< "$decision")"
            test "$state" = "missing" || test "$state" = "published"
            if test "$state" = "missing"; then
              npm publish "$tarball" --access public --provenance
            fi
            bun scripts/release/verify-npm-publication.ts \
              --package "$package_name" \
              --version "${{ needs.identity.outputs.version }}" \
              --source-commit "${{ needs.identity.outputs.commit }}" \
              --tarball "$tarball"
            published=$((published + 1))
          done < <(jq -r '.packages[] | [.name, .filename] | @tsv' "$release")
          test "$published" = "$(jq 'length' <<< "$TASQ_PUBLIC_PACKAGES")"

  github-release:
    needs: [identity, cli, npm]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Create or repair the immutable GitHub release
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/tasq-release-lookup.json"
          http_code="$(
            curl \
              --silent \
              --show-error \
              --output "$body" \
              --write-out '%{http_code}' \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}"
          )"
          if test "$http_code" = "200"; then
            release="$(
              gh release view "$GITHUB_REF_NAME" \
                --repo "$GITHUB_REPOSITORY" \
                --json assets,isDraft,isPrerelease,tagName,targetCommitish
            )"
            jq --exit-status \
              --arg tag "$GITHUB_REF_NAME" \
              --arg commit "${{ needs.identity.outputs.commit }}" \
              '
                .tagName == $tag
                and .targetCommitish == $commit
                and .isDraft == false
                and .isPrerelease == false
                and (.assets | type == "array")
              ' <<< "$release" >/dev/null
            mkdir -p existing-release
            for asset in dist/*; do
              name="$(basename "$asset")"
              count="$(
                jq --arg name "$name" \
                  '[.assets[] | select(.name == $name)] | length' \
                  <<< "$release"
              )"
              if test "$count" = 1; then
                gh release download "$GITHUB_REF_NAME" \
                  --repo "$GITHUB_REPOSITORY" \
                  --dir existing-release \
                  --pattern "$name"
                cmp "$asset" "existing-release/$name"
              elif test "$count" = 0; then
                gh release upload "$GITHUB_REF_NAME" "$asset" \
                  --repo "$GITHUB_REPOSITORY"
              else
                echo "Release contains duplicate asset name: $name" >&2
                exit 1
              fi
            done
          elif test "$http_code" = "404"; then
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --target "${{ needs.identity.outputs.commit }}"
          else
            echo "GitHub release lookup failed with HTTP $http_code" >&2
            jq '{message, documentation_url, status}' "$body" >&2 || true
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
