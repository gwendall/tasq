name: Certify v0.4 migration candidate

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact 40-character candidate source commit
        required: true
        type: string

permissions: {}

jobs:
  source-to-candidate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64-gnu
          - os: macos-14
            target: darwin-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
      attestations: read
    env:
      INPUT_SOURCE_COMMIT: ${{ inputs.source_commit }}
      MATRIX_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - run: pnpm install --frozen-lockfile
      - name: Validate and build the exact source candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$INPUT_SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$INPUT_SOURCE_COMMIT"
          bun scripts/release/build-public-release.ts \
            --version 0.4.0 \
            --source-commit "$INPUT_SOURCE_COMMIT" \
            --target "$MATRIX_TARGET" \
            --outdir dist/tq608/candidate
      - name: Download and attest the exact public source releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/tq608/published/v0.2.0 dist/tq608/published/v0.3.0
          gh release download v0.2.0 \
            --repo "$GITHUB_REPOSITORY" \
            --dir dist/tq608/published/v0.2.0 \
            --pattern "tasq-v0.2.0-${MATRIX_TARGET}.*"
          gh release download v0.3.0 \
            --repo "$GITHUB_REPOSITORY" \
            --dir dist/tq608/published/v0.3.0 \
            --pattern "tasq-v0.3.0-${MATRIX_TARGET}.*"
          test "$(find dist/tq608/published/v0.2.0 -type f | wc -l | tr -d ' ')" = "5"
          test "$(find dist/tq608/published/v0.3.0 -type f | wc -l | tr -d ' ')" = "5"
          for asset in dist/tq608/published/v0.2.0/*; do
            gh attestation verify "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "gwendall/tasq/.github/workflows/release.yml" \
              --source-digest 28f4d77477e81ae2277f73f326c8703e7124f192 \
              --source-ref refs/tags/v0.2.0 \
              --deny-self-hosted-runners
          done
          for asset in dist/tq608/published/v0.3.0/*; do
            gh attestation verify "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "gwendall/tasq/.github/workflows/release.yml" \
              --source-digest c093ed58ab2a9e38dbd9d877ba75021997761057 \
              --source-ref refs/tags/v0.3.0 \
              --deny-self-hosted-runners
          done
      - name: Replay the exact N-2 migration matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/tq608/evidence
          evidence="dist/tq608/evidence/v040-${MATRIX_TARGET}.json"
          bun packages/tasq-evals/scripts/certify-v040-migration-candidate.ts \
            --published-root dist/tq608/published \
            --candidate-dir dist/tq608/candidate \
            --candidate-source-commit "$INPUT_SOURCE_COMMIT" \
            --trust protected_github_attestations \
            > "$evidence"
          jq --exit-status '
            .status == "passed_protected_source_candidate_matrix"
            and .candidate.publishedArtifact == false
            and .candidate.publishedReplayPassed == false
            and (.releases | length) == 2
            and all(.releases[];
              .migration.targetFormat == 28
              and .downgrade.exitCode == 3
              and .downgrade.mutationPerformed == false
              and .downgrade.noLogicalOrRecoveryWrite == true
              and (.downgrade.physicalTreeByteExact | type) == "boolean"
              and .restore.doctorPassed == true
            )
            and all(.assertions[]; . == true)
            and .externalGate.publishedV040Replay == "not_run"
            and .publicSupportClaim == false
          ' "$evidence" >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tq608-v040-${{ matrix.target }}
          path: dist/tq608/evidence/*.json
          if-no-files-found: error
