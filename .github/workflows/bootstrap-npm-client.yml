name: Bootstrap npm remote client identity

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact main commit to build and publish
        required: true
        type: string
      confirmation:
        description: Type bootstrap-tasq-client-package
        required: true
        type: string

permissions: {}

concurrency:
  group: tasq-npm-client-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap-client:
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      BOOTSTRAP_VERSION: 0.1.0-alpha.0
      INPUT_CONFIRMATION: ${{ inputs.confirmation }}
      INPUT_SOURCE_COMMIT: ${{ inputs.source_commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Pin the npm bootstrap client
        run: |
          npm install --global npm@11.18.0
          test "$(npm --version)" = "11.18.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - name: Verify one-shot protected authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "gwendall/tasq"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$INPUT_CONFIRMATION" = "bootstrap-tasq-client-package"
          [[ "$INPUT_SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$INPUT_SOURCE_COMMIT"
          test "$(git rev-parse origin/main)" = "$INPUT_SOURCE_COMMIT"
          test -z "$(git tag --points-at HEAD)"
          bun scripts/release/verify-npm-client-bootstrap-authorization.ts \
            --version "$BOOTSTRAP_VERSION" \
            --source-commit "$INPUT_SOURCE_COMMIT" \
            --repository "$GITHUB_REPOSITORY"
      - run: pnpm install --frozen-lockfile
      - name: Verify the complete source candidate
        run: pnpm verify:handoff
      - name: Build and isolate only the remote client candidate
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/release/build-public-packages.ts \
            --version "$BOOTSTRAP_VERSION" \
            --source-commit "$INPUT_SOURCE_COMMIT" \
            --outdir dist/packages
          release="dist/packages/tasq-packages-v${BOOTSTRAP_VERSION}.release.json"
          mapfile -t filenames < <(
            jq -r '.packages[] | select(.name == "@tasq-run/client") | .filename' "$release"
          )
          test "${#filenames[@]}" = 1
          mkdir -p dist/client
          cp "dist/packages/${filenames[0]}" dist/client/
          test "$(find dist/client -maxdepth 1 -type f | wc -l | tr -d ' ')" = 1
          test "$(
            tar -xOf "dist/client/${filenames[0]}" package/package.json | jq -r .name
          )" = "@tasq-run/client"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/client/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tasq-npm-client-bootstrap-candidate
          path: dist/client/*
          if-no-files-found: error
      - name: Publish or verify only the byte-identical client identity
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_CLIENT_BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail
          : "${NODE_AUTH_TOKEN:?NPM_CLIENT_BOOTSTRAP_TOKEN is required}"
          mapfile -t candidates < <(find dist/client -maxdepth 1 -type f -name '*.tgz')
          test "${#candidates[@]}" = 1
          candidate="${candidates[0]}"
          decision="$(
            bun scripts/release/verify-npm-publication.ts \
              --package @tasq-run/client \
              --version "$BOOTSTRAP_VERSION" \
              --source-commit "$INPUT_SOURCE_COMMIT" \
              --tarball "$candidate" \
              --allow-missing
          )"
          state="$(jq --raw-output .status <<< "$decision")"
          test "$state" = "missing" || test "$state" = "published"
          if test "$state" = "missing"; then
            npm publish "$candidate" \
              --access public \
              --tag alpha-bootstrap \
              --provenance
          fi
          bun scripts/release/verify-npm-publication.ts \
            --package @tasq-run/client \
            --version "$BOOTSTRAP_VERSION" \
            --source-commit "$INPUT_SOURCE_COMMIT" \
            --tarball "$candidate"
