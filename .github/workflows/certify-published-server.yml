name: Certify published Tasq Server image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact published Server SemVer
        required: true
        type: string
      source_commit:
        description: Exact lowercase 40-character source commit
        required: true
        type: string
      digest:
        description: Exact immutable sha256 image digest
        required: true
        type: string
      confirmation:
        description: Type certify-tasq-server
        required: true
        type: string

permissions: {}

jobs:
  exact-image:
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      attestations: read
    env:
      INPUT_CONFIRMATION: ${{ inputs.confirmation }}
      INPUT_DIGEST: ${{ inputs.digest }}
      INPUT_SOURCE_COMMIT: ${{ inputs.source_commit }}
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out the protected certification automation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Snapshot the Server replay harness
        shell: bash
        run: |
          set -euo pipefail
          automation="$RUNNER_TEMP/tasq-certification-automation"
          mkdir -p "$automation"
          install -m 0755 \
            scripts/server-container-smoke.ts \
            "$automation/server-container-smoke.ts"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Validate exact certification identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "gwendall/tasq"
          test "$INPUT_CONFIRMATION" = "certify-tasq-server"
          [[ "$INPUT_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$INPUT_SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$INPUT_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          release_tag="v${INPUT_VERSION}"
          test "$GITHUB_REF" = "refs/heads/main" || test "$GITHUB_REF" = "refs/tags/${release_tag}"
          test "$(git rev-parse HEAD)" = "$INPUT_SOURCE_COMMIT"
          test "$(git rev-parse "refs/tags/${release_tag}^{commit}")" = "$INPUT_SOURCE_COMMIT"
      - name: Bind both immutable publication tags to the supplied digest
        shell: bash
        run: |
          set -euo pipefail
          for reference in \
            "ghcr.io/gwendall/tasq-server:${INPUT_VERSION}" \
            "ghcr.io/gwendall/tasq-server:sha-${INPUT_SOURCE_COMMIT}"; do
            resolved="$(
              docker buildx imagetools inspect "$reference" |
                awk '$1 == "Digest:" { print $2; exit }'
            )"
            [[ "$resolved" =~ ^sha256:[a-f0-9]{64}$ ]]
            test "$resolved" = "$INPUT_DIGEST"
          done
      - name: Verify GitHub provenance for the exact OCI subject
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh attestation verify
          "oci://ghcr.io/gwendall/tasq-server@$INPUT_DIGEST"
          --repo "$GITHUB_REPOSITORY"
          --signer-workflow "gwendall/tasq/.github/workflows/publish-server.yml"
          --source-digest "$INPUT_SOURCE_COMMIT"
          --source-ref "$GITHUB_REF"
          --deny-self-hosted-runners
      - run: pnpm install --frozen-lockfile
      - name: Pull and replay the exact digest
        shell: bash
        run: |
          set -euo pipefail
          reference="ghcr.io/gwendall/tasq-server@$INPUT_DIGEST"
          docker pull "$reference"
          docker tag "$reference" tasq-server:published-certification
          test "$(
            docker image inspect tasq-server:published-certification \
              --format '{{ index .Config.Labels "org.opencontainers.image.version" }}'
          )" = "$INPUT_VERSION"
          test "$(
            docker image inspect tasq-server:published-certification \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}'
          )" = "$INPUT_SOURCE_COMMIT"
          bun "$RUNNER_TEMP/tasq-certification-automation/server-container-smoke.ts" \
            tasq-server:published-certification
      - name: Install the hosted Console certification browser
        run: pnpm --filter @tasq-run/console exec playwright install --with-deps chromium
      - name: Certify hosted human actions against the exact digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/server
          bun packages/tasq-evals/scripts/certify-hosted-console-image.ts \
            --image "ghcr.io/gwendall/tasq-server@$INPUT_DIGEST" \
            > dist/server/tq811-browser.json
          jq --exit-status '
            .image.exactPublishedDigest == true
            and .publicSupportClaim == false
            and .browser.receiptReplay == true
          ' dist/server/tq811-browser.json >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tasq-server-tq811-browser-evidence
          path: dist/server/tq811-browser.json
          if-no-files-found: error
