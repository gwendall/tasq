name: Deploy Fly private beta

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: Exact published Tasq Server sha256 digest
        required: true
        type: string
      source_commit:
        description: Exact lowercase 40-character source commit in the image attestation
        required: true
        type: string
      initialize:
        description: Run the deterministic bootstrap manifest after deploy
        required: true
        default: false
        type: boolean
      control_database_mode:
        description: Control database binding for managed Cloud
        required: true
        default: local
        type: choice
        options:
          - local
          - managed
      confirmation:
        description: Type deploy-tasq-fly-beta or deploy-tasq-managed-cloud
        required: true
        type: string

permissions: {}

concurrency:
  group: tasq-fly-private-beta
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.confirmation == 'deploy-tasq-fly-beta'
    runs-on: ubuntu-latest
    environment: beta
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      attestations: read
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      INPUT_CONFIRMATION: ${{ inputs.confirmation }}
      INPUT_DIGEST: ${{ inputs.image_digest }}
      INPUT_SOURCE_COMMIT: ${{ inputs.source_commit }}
      TASQ_APP: tasq-api
      TASQ_CONFIG: deploy/fly-private-beta/fly.toml
      TASQ_IMAGE: ghcr.io/gwendall/tasq-server
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate immutable deployment authority
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "gwendall/tasq"
          test "$INPUT_CONFIRMATION" = "deploy-tasq-fly-beta"
          [[ "$INPUT_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$INPUT_SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$INPUT_SOURCE_COMMIT"
          test -n "$FLY_API_TOKEN"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify protected image provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh attestation verify
          "oci://$TASQ_IMAGE@$INPUT_DIGEST"
          --repo "$GITHUB_REPOSITORY"
          --signer-workflow "gwendall/tasq/.github/workflows/publish-server.yml"
          --source-ref "refs/heads/main"
          --deny-self-hosted-runners
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
      - name: Verify fail-closed Fly topology
        shell: bash
        run: |
          set -euo pipefail
          test "$(flyctl status --app "$TASQ_APP" --json | jq -r .Name)" = "$TASQ_APP"
          volumes="$(flyctl volumes list --app "$TASQ_APP" --json)"
          test "$(jq '[.[] | select(.name == "tasq_data")] | length' <<< "$volumes")" = 1
          jq --exit-status '.[] | select(.name == "tasq_data")
            | .region == "cdg" and .encrypted == true and .snapshot_retention >= 30' \
            <<< "$volumes" >/dev/null
          secrets="$(flyctl secrets list --app "$TASQ_APP" --json)"
          for required in TASQ_SERVER_BOOTSTRAP_B64 TASQ_SERVER_CONFIG_B64 TASQ_SERVER_ENROLLMENT_PEPPER; do
            jq --exit-status --arg name "$required" 'any(.[]; .name == $name)' \
              <<< "$secrets" >/dev/null
          done
          flyctl certs check api.tasq.run --app "$TASQ_APP" >/dev/null
      - name: Deploy one exact Server writer
        shell: bash
        run: >-
          flyctl deploy
          --config "$TASQ_CONFIG"
          --app "$TASQ_APP"
          --image "$TASQ_IMAGE@$INPUT_DIGEST"
          --ha=false
          --strategy immediate
          --wait-timeout 10m
      - name: Initialize the exact bootstrap manifest
        if: inputs.initialize
        shell: bash
        run: |
          set -euo pipefail
          machine_id=""
          for attempt in $(seq 1 30); do
            machine_id="$(
              flyctl machines list --app "$TASQ_APP" --json |
                jq --raw-output '[.[] | select(.state == "started")][0].id // empty'
            )"
            test -n "$machine_id" && break
            sleep 2
          done
          test -n "$machine_id"
          flyctl ssh console --app "$TASQ_APP" --machine "$machine_id" --command \
            "bun /app/packages/tasq-server/src/daemon.ts bootstrap \
            --config /etc/tasq/server.json \
            --bootstrap /etc/tasq/bootstrap.json"
      - name: Prove canonical public routes
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --retry 12 --retry-all-errors --retry-delay 5 https://api.tasq.run/healthz
          curl --fail --retry 12 --retry-all-errors --retry-delay 5 https://api.tasq.run/readyz
          curl --fail https://api.tasq.run/version > version.json
          console_status="$(
            curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              https://api.tasq.run/console
          )"
          test "$console_status" = 401
          machine_count="$(flyctl machines list --app "$TASQ_APP" --json | jq '[.[] | select(.state == "started")] | length')"
          test "$machine_count" = 1
          jq --null-input \
            --arg app "$TASQ_APP" \
            --arg image "$TASQ_IMAGE@$INPUT_DIGEST" \
            --arg sourceCommit "$INPUT_SOURCE_COMMIT" \
            --argjson version "$(cat version.json)" \
            '{
              contractVersion: "tasq.fly-private-beta-deployment.v1",
              app: $app,
              region: "cdg",
              publicOrigin: "https://api.tasq.run/",
              consoleEntrypoint: "https://cloud.tasq.run/",
              image: $image,
              sourceCommit: $sourceCommit,
              writerMachines: 1,
              version: $version,
              remoteEffectsEnabled: false
            }' > fly-private-beta-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tasq-fly-private-beta-deployment
          path: fly-private-beta-report.json
          if-no-files-found: error

  deploy-managed-cloud:
    if: inputs.confirmation == 'deploy-tasq-managed-cloud'
    runs-on: ubuntu-latest
    environment: beta
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
      attestations: read
    env:
      FLY_CONTROL_API_TOKEN: ${{ secrets.FLY_CONTROL_API_TOKEN }}
      FLY_IDENTITY_API_TOKEN: ${{ secrets.FLY_IDENTITY_API_TOKEN }}
      INPUT_CONFIRMATION: ${{ inputs.confirmation }}
      INPUT_DIGEST: ${{ inputs.image_digest }}
      INPUT_SOURCE_COMMIT: ${{ inputs.source_commit }}
      INPUT_CONTROL_DATABASE_MODE: ${{ inputs.control_database_mode }}
      TASQ_ID_OPERATOR_USERNAME: ${{ secrets.TASQ_ID_OPERATOR_USERNAME }}
      TASQ_ID_OPERATOR_PASSWORD: ${{ secrets.TASQ_ID_OPERATOR_PASSWORD }}
      TASQ_SERVER_IMAGE: ghcr.io/gwendall/tasq-server
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate immutable deployment authority
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "gwendall/tasq"
          test "$INPUT_CONFIRMATION" = "deploy-tasq-managed-cloud"
          [[ "$INPUT_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$INPUT_SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$INPUT_SOURCE_COMMIT"
          test -n "$FLY_CONTROL_API_TOKEN"
          test -n "$FLY_IDENTITY_API_TOKEN"
          test -n "$TASQ_ID_OPERATOR_USERNAME"
          test -n "$TASQ_ID_OPERATOR_PASSWORD"
          test "${#TASQ_ID_OPERATOR_PASSWORD}" -ge 32
          test "$INPUT_CONTROL_DATABASE_MODE" = local || test "$INPUT_CONTROL_DATABASE_MODE" = managed
          grep -F 'operatorUsername: required("TASQ_ID_OPERATOR_USERNAME")' \
            packages/tasq-cloud-control-plane/src/identity-runtime.ts >/dev/null
          grep -F 'operatorPassword: required("TASQ_ID_OPERATOR_PASSWORD")' \
            packages/tasq-cloud-control-plane/src/identity-runtime.ts >/dev/null
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify protected Server image provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh attestation verify
          "oci://$TASQ_SERVER_IMAGE@$INPUT_DIGEST"
          --repo "$GITHUB_REPOSITORY"
          --signer-workflow "gwendall/tasq/.github/workflows/publish-server.yml"
          --source-ref "refs/heads/main"
          --deny-self-hosted-runners
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
      - name: Verify fail-closed managed Cloud topology
        shell: bash
        run: |
          set -euo pipefail
          test "$(FLY_API_TOKEN="$FLY_CONTROL_API_TOKEN" flyctl status --app tasq-control --json | jq -r .Name)" = tasq-control
          test "$(FLY_API_TOKEN="$FLY_IDENTITY_API_TOKEN" flyctl status --app tasq-identity --json | jq -r .Name)" = tasq-identity
          volumes="$(FLY_API_TOKEN="$FLY_CONTROL_API_TOKEN" flyctl volumes list --app tasq-control --json)"
          test "$(jq '[.[] | select(.name == "tasq_control_data")] | length' <<< "$volumes")" = 1
          jq --exit-status '.[] | select(.name == "tasq_control_data")
            | .region == "cdg" and .encrypted == true and .snapshot_retention >= 30' \
            <<< "$volumes" >/dev/null
          control_secrets="$(FLY_API_TOKEN="$FLY_CONTROL_API_TOKEN" flyctl secrets list --app tasq-control --json)"
          for required in TASQ_CLOUD_ADMIN_TOKEN TASQ_CLOUD_DOWNSTREAM_BEARER \
            TASQ_CLOUD_IDENTITY_PEPPER TASQ_CLOUD_OIDC_CLIENT_SECRET \
            TASQ_CLOUD_SESSION_PEPPER TASQ_CLOUD_STATE_KEY; do
            jq --exit-status --arg name "$required" 'any(.[]; .name == $name)' \
              <<< "$control_secrets" >/dev/null
          done
          if test "$INPUT_CONTROL_DATABASE_MODE" = managed; then
            for required in TASQ_CLOUD_DATABASE_URL TASQ_CLOUD_DATABASE_AUTH_TOKEN; do
              jq --exit-status --arg name "$required" 'any(.[]; .name == $name)' \
                <<< "$control_secrets" >/dev/null
            done
          fi
          identity_secrets="$(FLY_API_TOKEN="$FLY_IDENTITY_API_TOKEN" flyctl secrets list --app tasq-identity --json)"
          for required in TASQ_ID_CLIENT_SECRET TASQ_ID_OPERATOR_SUBJECT \
            TASQ_ID_SIGNING_KEY_PKCS8; do
            jq --exit-status --arg name "$required" 'any(.[]; .name == $name)' \
              <<< "$identity_secrets" >/dev/null
          done
          FLY_API_TOKEN="$FLY_CONTROL_API_TOKEN" flyctl certs check control.tasq.run --app tasq-control >/dev/null
          FLY_API_TOKEN="$FLY_IDENTITY_API_TOKEN" flyctl certs check id.tasq.run --app tasq-identity >/dev/null
      - name: Stage fail-closed operator credentials
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_IDENTITY_API_TOKEN }}
        run: >-
          flyctl secrets set
          --app tasq-identity
          --stage
          TASQ_ID_OPERATOR_USERNAME="$TASQ_ID_OPERATOR_USERNAME"
          TASQ_ID_OPERATOR_PASSWORD="$TASQ_ID_OPERATOR_PASSWORD"
      - name: Deploy fail-closed reference identity
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_IDENTITY_API_TOKEN }}
        run: >-
          flyctl deploy
          --config deploy/managed-cloud/identity.fly.toml
          --dockerfile deploy/managed-cloud/Dockerfile
          --app tasq-identity
          --remote-only
          --ha=false
          --strategy immediate
          --wait-timeout 10m
      - name: Prove identity authentication boundary
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --retry 12 --retry-all-errors --retry-delay 5 \
            https://id.tasq.run/healthz > identity-health.json
          jq --exit-status \
            '.status == "ok" and .authorizationCodeAuthentication == "http_basic"' \
            identity-health.json >/dev/null
          anonymous_status="$(
            curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --get https://id.tasq.run/authorize \
              --data-urlencode response_type=code \
              --data-urlencode client_id=tasq-control \
              --data-urlencode redirect_uri=https://control.tasq.run/oidc/callback \
              --data-urlencode state=anonymous-must-fail \
              --data-urlencode scope=openid
          )"
          test "$anonymous_status" = 401
          authenticated_status="$(
            curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --user "$TASQ_ID_OPERATOR_USERNAME:$TASQ_ID_OPERATOR_PASSWORD" \
              --get https://id.tasq.run/authorize \
              --data-urlencode response_type=code \
              --data-urlencode client_id=tasq-control \
              --data-urlencode redirect_uri=https://control.tasq.run/oidc/callback \
              --data-urlencode state=authenticated-must-redirect \
              --data-urlencode scope=openid
          )"
          test "$authenticated_status" = 303
          printf '%s\n' "$anonymous_status" > identity-anonymous-status.txt
          printf '%s\n' "$authenticated_status" > identity-authenticated-status.txt
      - name: Deploy same-origin Cloud control plane
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_CONTROL_API_TOKEN }}
        run: >-
          flyctl deploy
          --config deploy/managed-cloud/control.fly.toml
          --dockerfile deploy/managed-cloud/Dockerfile
          --app tasq-control
          --env TASQ_CLOUD_DATABASE_MODE="$INPUT_CONTROL_DATABASE_MODE"
          --remote-only
          --ha=false
          --strategy immediate
          --wait-timeout 10m
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.2.0
        with:
          version: 10.29.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.2.0
        with:
          node-version: 22.18.0
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.1.3
        with:
          bun-version: 1.3.11
      - name: Install browser certification dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Certify deployed Cloud browser boundary
        shell: bash
        run: bun scripts/certify-managed-cloud-browser.ts > managed-cloud-browser.json
      - name: Record bounded deployment evidence
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --retry 12 --retry-all-errors --retry-delay 5 \
            https://control.tasq.run/healthz > control-health.json
          control_machine="$(FLY_API_TOKEN="$FLY_CONTROL_API_TOKEN" flyctl machines list --app tasq-control --json | jq '[.[] | select(.state == "started")][0]')"
          identity_machine="$(FLY_API_TOKEN="$FLY_IDENTITY_API_TOKEN" flyctl machines list --app tasq-identity --json | jq '[.[] | select(.state == "started")][0]')"
          test "$(FLY_API_TOKEN="$FLY_CONTROL_API_TOKEN" flyctl machines list --app tasq-control --json | jq '[.[] | select(.state == "started")] | length')" = 1
          test "$(FLY_API_TOKEN="$FLY_IDENTITY_API_TOKEN" flyctl machines list --app tasq-identity --json | jq '[.[] | select(.state == "started")] | length')" = 1
          browser_digest="sha256:$(sha256sum managed-cloud-browser.json | cut -d' ' -f1)"
          jq --null-input \
            --arg sourceCommit "$INPUT_SOURCE_COMMIT" \
            --arg serverImage "$TASQ_SERVER_IMAGE@$INPUT_DIGEST" \
            --arg identityMachineId "$(jq -r .id <<< "$identity_machine")" \
            --arg identityImage "$(jq -r .config.image <<< "$identity_machine")" \
            --arg controlMachineId "$(jq -r .id <<< "$control_machine")" \
            --arg controlImage "$(jq -r .config.image <<< "$control_machine")" \
            --arg controlDatabaseMode "$INPUT_CONTROL_DATABASE_MODE" \
            --arg browserDigest "$browser_digest" \
            --argjson browser "$(cat managed-cloud-browser.json)" \
            --argjson identityHealth "$(cat identity-health.json)" \
            '{
              contractVersion: "tasq.managed-cloud-deployment.v1",
              sourceCommit: $sourceCommit,
              serverImage: $serverImage,
              region: "cdg",
              identity: {
                app: "tasq-identity",
                publicOrigin: "https://id.tasq.run/",
                machineId: $identityMachineId,
                image: $identityImage,
                health: $identityHealth,
                anonymousAuthorizationStatus: 401,
                authenticatedAuthorizationStatus: 303
              },
              control: {
                app: "tasq-control",
                publicOrigin: "https://control.tasq.run/",
                machineId: $controlMachineId,
                image: $controlImage,
                databaseMode: $controlDatabaseMode
              },
              browserEvidenceDigest: $browserDigest,
              browser: $browser,
              remoteEffectsEnabled: false,
              managedCloudAvailable: false
            }' > managed-cloud-deployment.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tasq-managed-cloud-deployment
          path: |
            managed-cloud-deployment.json
            managed-cloud-browser.json
          if-no-files-found: error
