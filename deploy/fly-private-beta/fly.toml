app = "tasq-api"
primary_region = "cdg"
kill_signal = "SIGTERM"
kill_timeout = "30s"

# The image is intentionally absent here. The protected workflow supplies the
# exact ghcr.io/gwendall/tasq-server@sha256:... reference with --image.
[deploy]
  strategy = "immediate"
  wait_timeout = "10m"

[experimental]
  cmd = ["serve", "--config", "/etc/tasq/server.json"]

[[files]]
  guest_path = "/etc/tasq/server.json"
  secret_name = "TASQ_SERVER_CONFIG_B64"

[[files]]
  guest_path = "/etc/tasq/bootstrap.json"
  secret_name = "TASQ_SERVER_BOOTSTRAP_B64"

[mounts]
  source = "tasq_data"
  destination = "/var/lib/tasq"
  snapshot_retention = 30
  scheduled_snapshots = true

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    method = "GET"
    path = "/readyz"
    timeout = "5s"

[[restart]]
  policy = "on-failure"
  retries = 10

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
