app = "tasq-identity"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  TASQ_ID_ISSUER = "https://id.tasq.run/"
  TASQ_ID_CLIENT_ID = "tasq-control"
  TASQ_ID_REDIRECT_URI = "https://control.tasq.run/oidc/callback"
  TASQ_ID_POST_LOGOUT_REDIRECT_URI = "https://control.tasq.run/"

[experimental]
  cmd = ["bun", "src/identity-runtime.ts"]

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
